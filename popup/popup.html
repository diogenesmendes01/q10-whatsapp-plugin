<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #111827;
      background: #F9FAFB;
    }

    .popup-header {
      background: linear-gradient(135deg, #0EA5E9, #0369A1);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .popup-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 700;
    }

    .popup-subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .popup-body {
      padding: 20px;
    }

    .status-card {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.green { background: #10B981; }
    .status-dot.red { background: #EF4444; }
    .status-dot.yellow { background: #F59E0B; }

    .status-text {
      font-size: 13px;
      font-weight: 500;
    }

    .status-hint {
      font-size: 11px;
      color: #6B7280;
      margin-top: 2px;
    }

    .popup-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #0EA5E9;
      color: white;
    }
    .btn-primary:hover { background: #0369A1; }

    .btn-outline {
      background: white;
      color: #374151;
      border: 1px solid #D1D5DB;
    }
    .btn-outline:hover { background: #F3F4F6; }

    .popup-footer {
      text-align: center;
      padding: 12px 20px;
      border-top: 1px solid #E5E7EB;
      font-size: 11px;
      color: #9CA3AF;
    }

    .popup-footer a {
      color: #0EA5E9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">Q</div>
    <div class="popup-title">Q10 CRM</div>
    <div class="popup-subtitle">para WhatsApp Web · Genius Idiomas</div>
  </div>

  <div class="popup-body">
    <div class="status-card" id="api-status">
      <div class="status-dot yellow" id="status-dot"></div>
      <div>
        <div class="status-text" id="status-text">Verificando...</div>
        <div class="status-hint" id="status-hint"></div>
      </div>
    </div>

    <button class="popup-btn btn-primary" id="btn-settings">
      ⚙️ Configurações
    </button>

    <button class="popup-btn btn-outline" id="btn-whatsapp">
      💬 Abrir WhatsApp Web
    </button>
  </div>

  <div class="popup-footer">
    v1.0.0 · <a href="https://app.q10.com" target="_blank">Q10 Académico</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
