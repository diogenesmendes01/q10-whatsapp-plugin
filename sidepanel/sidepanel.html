<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q10 CRM</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="q10-root">
    <div class="q10-header">
      <div class="q10-header-left">
        <span class="q10-header-logo">
          <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="white" fill-opacity="0.2"/><text x="14" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Inter,sans-serif">Q</text></svg>
        </span>
        <div>
          <div class="q10-header-title">Q10 CRM</div>
          <div class="q10-header-subtitle">Genius Idiomas</div>
        </div>
      </div>
      <button id="btn-batch-leads" title="Importar leads antigos"
        style="background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:6px 10px;
               color:white;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;">
        &#9776; Leads
      </button>
    </div>
    <div class="q10-body" id="q10-body"></div>
    <div class="q10-actions" id="q10-actions" style="display:none;"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
